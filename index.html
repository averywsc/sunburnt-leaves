const sec=b=>b<4?'intro':b<12?'verse':b<20?'chorus':b<24?'break':'last chorus';
function impulse(sec,dec){const n=ctx.sampleRate*sec,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}return b}

function init(){
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 const comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=6;comp.attack.value=.004;comp.release.value=.18;
 master=ctx.createGain();master.gain.value=.95;master.connect(comp);comp.connect(ctx.destination);
 verb=ctx.createConvolver();verb.buffer=impulse(4,2.6);const vg=ctx.createGain();vg.gain.value=.9;verb.connect(vg);vg.connect(master);
 delay=ctx.createDelay(1);delay.delayTime.value=S*3;const fb=ctx.createGain(),lp=ctx.createBiquadFilter();fb.gain.value=.42;lp.frequency.value=2800;
 delay.connect(lp);lp.connect(fb);fb.connect(delay);const dg=ctx.createGain();dg.gain.value=.6;delay.connect(dg);dg.connect(master);dg.connect(verb);
 sat=ctx.createWaveShaper();sat.curve=Float32Array.from({length:256},(_,i)=>Math.tanh(2.4*(i/128-1)));sat.connect(master);

 cd.delayTime.value=.022;cl.frequency.value=.7;cg.gain.value=.006;cl.connect(cg);cg.connect(cd.delayTime);cl.start();cw.gain.value=.6;chor.connect(cd);cd.connect(cw);cw.connect(master);cw.connect(verb);

function pad(ch,t,dur,v=1){

 f.frequency.setValueAtTime(450,t);f.frequency.linearRampToValueAtTime(1500,t+dur*.6);f.frequency.linearRampToValueAtTime(600,t+dur+1.5);
 const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16*v,t+1.4);g.gain.linearRampToValueAtTime(.12*v,t+dur);g.gain.linearRampToValueAtTime(.0001,t+dur+2);

 ch.forEach(m=>[-7,7].forEach(c=>{const o=ctx.createOscillator(),og=ctx.createGain();o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=c;og.gain.value=.07;o.connect(og);og.connect(f);o.start(t);o.stop(t+dur+2.1)}));

function bell(m,t,v){
 const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain();
 o.frequency.value=mtof(m);o2.frequency.value=mtof(m)*3.01;g2.gain.value=.22;o2.connect(g2);g2.connect(g);o.connect(g);

function pluck(m,t,v){

 nz(t,1800,'bandpass',.2,.28*v,.5,.25);nz(t,300,'lowpass',.08,.25*v,.2,0);
 const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(130,t+.08);
 g.gain.setValueAtTime(.2*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);send(g,.8,.3,0);o.start(t);o.stop(t+.15);
}
function keys(m,t,v){
 const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
 o.type='triangle';o2.type='sine';o.frequency.value=mtof(m);o2.frequency.value=mtof(m)*2;o.detune.value=-4;f.type='lowpass';f.frequency.value=2200;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
 o.connect(f);o2.connect(f);f.connect(g);g.connect(chor);send(g,.4,.6,.3);o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+1.7);
}
function lead(m,t,len){
 const f=ctx.createBiquadFilter(),g=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();
 f.type='lowpass';f.frequency.value=2600;l.frequency.value=5;lg.gain.value=6;l.connect(lg);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.07,t+.06);g.gain.linearRampToValueAtTime(.05,t+len*.6);g.gain.linearRampToValueAtTime(.0001,t+len);
 [['sawtooth',-8],['triangle',0],['sawtooth',8]].forEach(([ty,c])=>{const o=ctx.createOscillator();o.type=ty;o.frequency.value=mtof(m);o.detune.value=c;lg.connect(o.detune);o.connect(f);o.start(t);o.stop(t+len+.05)});
 f.connect(g);g.connect(chor);send(g,.5,.7,.6);l.start(t);l.stop(t+len+.05);
}
function sched(n,t){
 // runs for every tiny beat
 const bar=Math.floor(n/16),b=bar%L,s=n%16,ch=chords[PROG[b]],R=()=>.85+Math.random()*.3;
 const verse=b>=4&&b<12,chor2=(b>=12&&b<20)||b>=24,brk=b>=20&&b<24,beat=verse||chor2;
 if(s===0)document.getElementById('st').textContent=sec(b);
 // pads and crackle
 if(s===0&&b%2===0)pad(ch,t,32*S,chor2?1.1:.8);
 if(Math.random()<.15)nz(t,6500,'highpass',.008,.02,0,0);
 // keys, bells and voice
 if(b>=2&&!brk&&(s===0||s===10))ch.slice(0,4).forEach(m=>keys(m+12,t,.05*R()));
 if(b>=2){const p=(bar%2?PB:PA)[s];if(p>=0&&(chor2||s%4===0))bell(ch[p]+12,t,.07)}
 if(s===0&&(chor2||brk))voice(ch[1+bar%4]+12,t,S*(brk?15:13));
 // drums and bass
 if(beat){
  if(s===0||s===10||(chor2&&s===7))kick(t,0);
  if(s===4||s===12)snare(t,R());
  if(s%2===0)nz(t,9000,'highpass',.03,.04*R(),.1,0);
  if(chor2&&s===14)nz(t,8000,'highpass',.14,.07,.3,.2);
  if((chor2?[0,3,6,8,11,14]:[0,6,10]).includes(s))bass(ch[0]-12,t,s===0?1.1:.35,chor2);
 }
 // lead
 if(chor2){const p=(bar%2?LB:LA)[s];if(p>=0)lead(ch[p]+12,t,S*3)}
 if(s===0&&(b===12||b===24))nz(t,5000,'highpass',.9,.18,.8,.4);
}
function tick(){while(nextT<ctx.currentTime+.15){sched(step,nextT+(step%2?S*.1:0)+(Math.random()-.5)*.01);nextT+=S;step++}}
const $=s=>document.querySelector(s),pb=$('#pb'),fmt=s=>(s/60|0)+':'+String(s%60|0).padStart(2,'0');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const hl=s=>esc(s).replace(/(\/\/.*)|('[^']*')|\b(const|function|return|if|else|let|for)\b|(\b\d+\.?\d*\b)/g,(m,c,q,k,n)=>'<i class="'+(c?'c':q?'q':k?'k':'n')+'">'+m+'</i>');
$('#m').textContent=fmt(L*16*S)+'\u2003'+BPM+' bpm';
$('#cd').innerHTML=hl(String(sched));
pb.onclick=async()=>{
 if(!playing){init();await ctx.resume();step=0;nextT=ctx.currentTime+.1;timer=setInterval(tick,25);playing=true;pb.textContent='Stop'}
 else{clearInterval(timer);playing=false;pb.textContent='Play';$('#st').textContent='';ctx.close();ctx=null}
};
